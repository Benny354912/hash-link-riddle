<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hash Link</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="stage">
        <section class="center-ui">
            <label id="main-label" class="sr-only" for="main-input">Geheime Eingabe</label>
            <input id="main-input" class="main-input" type="text" placeholder="Geheime Eingabe" autocomplete="off" />

            <div id="creator-tools" class="creator-tools">
                <div class="url-row">
                    <input id="share-url" class="share-url" type="text" readonly />
                    <button id="copy-btn" class="copy-btn" type="button">Kopieren</button>
                </div>

                <div class="settings-card">
                    <div class="setting-row">
                        <div class="setting-copy">
                            <label class="setting-title" for="algo-select">Hash-Verfahren</label>
                            <p class="setting-hint">Wird in der URL gespeichert und beim Raten automatisch erkannt.</p>
                        </div>
                        <select id="algo-select" class="algo-select">
                            <option value="sha256" selected>SHA-256</option>
                            <option value="md5">MD5</option>
                            <option value="pbkdf2-sha256">PBKDF2-SHA-256 (Password Hash)</option>
                            <option value="pbkdf2-sha512">PBKDF2-SHA-512 (Password Hash)</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <div class="setting-copy">
                            <span class="setting-title">Groß/Klein beachten</span>
                            <p class="setting-hint">Wenn deaktiviert, wird vor dem Hashing in Kleinbuchstaben
                                umgewandelt.</p>
                        </div>
                        <label class="switch" for="case-sensitive">
                            <input id="case-sensitive" type="checkbox" checked />
                            <span class="switch-ui" aria-hidden="true"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <div class="setting-copy">
                            <span class="setting-title">Sicheres Salt verwenden</span>
                            <p id="salt-note" class="setting-hint">Salt ist aktiv und wird in der URL uebergeben.</p>
                        </div>
                        <label class="switch" for="use-salt">
                            <input id="use-salt" type="checkbox" checked />
                            <span class="switch-ui" aria-hidden="true"></span>
                        </label>
                    </div>

                    <div id="salt-row" class="salt-row">
                        <input id="salt-value" class="salt-value" type="text" readonly />
                        <button id="regen-salt-btn" class="regen-btn" type="button">Neu</button>
                    </div>
                </div>
            </div>

            <p id="status" class="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="art-footer" aria-label="Projektinformationen">
        <div class="art-footer-inner">
            <span>&copy; 2026 Benny354912</span>
            <span class="footer-divider" aria-hidden="true"></span>
            <a href="https://github.com/Benny354912/hash-link-riddle" target="_blank"
                rel="noopener noreferrer">GitHub</a>
            <span class="footer-divider" aria-hidden="true"></span>
            <span>V3</span>
        </div>
    </footer>

    <script defer src="app.js"></script>
</body>

</html>
